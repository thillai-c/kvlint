name: Release

# Publishes to PyPI via Trusted Publishing (OIDC). No API tokens stored.
#
# One-time setup on PyPI before the first run:
#   PyPI -> Your projects -> kvlint -> Publishing -> Add a new pending publisher
#     Owner:            <github-owner>
#     Repository:       kvlint
#     Workflow name:    release.yml
#     Environment name: pypi
# Then create a GitHub environment named `pypi` on the repo.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
