name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # The project is developed on Windows and the acceptance criteria
          # target macOS + Linux, so cover all three on one version.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy kvlint

      # Offline by design: the default suite uses a vendored tokenizer fixture so
      # a HuggingFace outage can never turn CI red. See the `network` job below.
      #
      # `not perf` has to be repeated here. pytest's -m takes a single value, so
      # this flag REPLACES the `-m 'not perf'` in pyproject's addopts rather than
      # combining with it. Without it CI runs the benchmarks, which allocate 20M
      # token ids and assert a wall-clock budget on a shared runner.
      - name: Test
        run: uv run pytest -m "not network and not perf"

  network:
    # Non-blocking: exercises the real Qwen2.5 tokenizer and chat template.
    # Allowed to fail so an upstream Hub outage does not block merges.
    name: test (network, real tokenizer)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Cache HuggingFace tokenizers
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Test (network)
        run: |
          set +e
          uv run pytest -m "network and not perf"
          code=$?
          # pytest exits 5 when no tests match the selector. There are no
          # network-marked tests until M1 adds the real-tokenizer golden tests,
          # and "nothing to run" is not a failure.
          if [ "$code" -eq 5 ]; then
            echo "No network-marked tests yet; nothing to run."
            exit 0
          fi
          exit $code
