[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvlint"
dynamic = ["version"]
description = "A linter for your prefix cache: analyze LLM request logs offline for vLLM and SGLang KV-cache hit rate, and find what breaks it."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thillai Muthukumar" }]
keywords = ["llm", "vllm", "sglang", "kv-cache", "prefix-cache", "inference", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "transformers>=4.40",
    "tokenizers>=0.19",
    # transformers does not require jinja2, but apply_chat_template does and it is
    # on our critical path for every chat-format log.
    "jinja2>=3.1",
]

[project.optional-dependencies]
report = ["plotly>=5.20"]
live = ["httpx>=0.27"]

[project.scripts]
kvlint = "kvlint.cli:app"

[project.urls]
Homepage = "https://github.com/tmuthukumar/kvlint"
Repository = "https://github.com/tmuthukumar/kvlint"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[tool.hatch.version]
path = "kvlint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kvlint"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `kvlint/tokenize/` intentionally mirrors the layout in KVLINT_BUILD_PLAN.md §3.
# It shadows the stdlib `tokenize` module name, which is harmless under absolute
# imports (PEP 328) since we never import it as a bare top-level `tokenize`.
"kvlint/tokenize/*" = ["A005"]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kvlint"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["kvlint"]

[[tool.mypy.overrides]]
module = ["transformers.*", "tokenizers.*", "plotly.*", "numpy.*"]
ignore_missing_imports = true
# Do not analyze these third-party trees. numpy arrives transitively via
# transformers and its stubs use `type` statements, which are 3.12+ syntax that
# our 3.11 target cannot parse. We only ever touch these behind `Any` anyway.
follow_imports = "skip"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: requires network access (downloads a HuggingFace tokenizer). Deselect with -m 'not network'.",
]

[tool.coverage.run]
branch = true
source = ["kvlint"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
